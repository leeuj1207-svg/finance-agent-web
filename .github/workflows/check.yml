name: Check public static site

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Verify reviewed public files and synthetic analysis
        run: |
          git ls-files -z > "$RUNNER_TEMP/public-files"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFile, readdir, lstat } from 'node:fs/promises';
          import { createHash } from 'node:crypto';
          // Release allowlist: update only after explicitly reviewing the new public bytes.
          const approved = {".nojekyll": "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855", "app.js": "f96bff2450dea6030dddd26a6536c06bd52a2cfb33d0e20f05c5c328c41ae1a4", "core.js": "c56777d00ffde1c72261e0125f3a7edd6939aba652e84294797d8260abad1cf7", "data.js": "12682b11cdf33dc2b6aa1b6978b46041619a567f1a780c3e6a22a91523c9f9e8", "icon.svg": "ebbdb33478cd87e8efdad445902b96db4ed5d1b06516db13b746b4961e30500d", "index.html": "38945cf7ae95753044d65e2c38e3389f933c793a78f08358177c3261bca4178d", "local.js": "9658f08677f61465cfd8054d1acd64946cc90fa63d0140e2ddb28c441d350a35", "records.js": "26fa5f8437fc8f3a7bb8880a20d1c3636cd319706d77822d3da7c45d58de2b18", "storage.js": "dd7046d7dfd4c197e85f0d655b21101cb15bae80715180e6f58ee7e778188c8c", "styles.css": "0d8c2c02af3b82556f342f104d8cbe0cff6ff0e2fc8da175a1eee77008586d11"};
          assert.deepEqual((await readdir('site')).sort(), Object.keys(approved).sort());
          const expectedFiles = [...Object.keys(approved).map(name => `site/${name}`), '.gitignore', 'README.md', '.github/workflows/check.yml', '.github/workflows/pages.yml'].sort();
          assert.deepEqual((await readFile(`${process.env.RUNNER_TEMP}/public-files`, 'utf8')).split('\0').filter(Boolean).sort(), expectedFiles, 'Only the approved public inventory may be tracked');
          assert.equal((await lstat('site')).isSymbolicLink(), false);
          for (const [name, sha256] of Object.entries(approved)) {
            const entry = await lstat(`site/${name}`);
            assert.ok(entry.isFile() && !entry.isSymbolicLink(), 'Public assets must be regular files');
            assert.equal(createHash('sha256').update(await readFile(`site/${name}`)).digest('hex'), sha256, 'Public asset differs from its reviewed release');
          }
          const html = await readFile('site/index.html', 'utf8');
          for (const policy of ["connect-src 'none'", "form-action 'none'", "script-src 'self'"])
            assert.ok(html.includes(policy), 'Browser privacy policy must be retained');
          const { planReport, monthlyReview, parsePurchases, parseExpenses, summarizeExpenses } = await import('./site/core.js');
          const { DEMO_PURCHASES, DEMO_EXPENSES } = await import('./site/data.js');
          assert.equal(planReport('2026-01').total.target_amount, '1260000.00');
          const review = monthlyReview(parsePurchases(DEMO_PURCHASES), '2026-01');
          assert.equal(review.total.purchased_amount, '1180000.00');
          assert.equal(review.total.reserved_amount, '80000.00');
          assert.equal(review.total.remaining_amount, '0.00');
          assert.equal(summarizeExpenses(parseExpenses(DEMO_EXPENSES), '2026-01').total_expenses, '131900.00');
          const { validateRecord, makeBackup, parseBackup, restoreRecords, purchaseRow, expenseRow } = await import('./site/records.js');
          const buy = validateRecord({id:'synthetic-buy',type:'investment',date:'2026-01-13',account:'new_funds',symbol:'379800',kind:'purchase',amount:'270000',memo:''});
          const reserve = validateRecord({...buy,id:'synthetic-reserve',symbol:'CASH-RESERVE',kind:'reserve',amount:'80000'});
          const expense = validateRecord({id:'synthetic-expense',type:'expense',date:'2026-01-14',merchant:'합성 카페',amount:'4500',description:'',category:''});
          const rows = [buy,reserve,expense];
          assert.deepEqual(parseBackup(makeBackup(rows)).records, rows);
          assert.equal(restoreRecords(rows, rows, 'merge').length, 3);
          assert.equal(restoreRecords(rows, [expense], 'replace').length, 1);
          assert.throws(() => parseBackup('{'));
          assert.throws(() => parseBackup(JSON.stringify({...JSON.parse(makeBackup(rows)),schemaVersion:999})));
          assert.throws(() => restoreRecords(rows,[{...buy,amount:'1'}],'merge'));
          assert.equal(monthlyReview([buy,reserve].map(purchaseRow),'2026-01').total.actual_amount,'350000.00');
          assert.equal(summarizeExpenses([expenseRow(expense)],'2026-01').by_category['식비'],'4500.00');
          console.log('Ten reviewed static files, synthetic analysis and 1.3 backup contracts verified.');
          JS
      - name: Install temporary browser test tools (not published)
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Test the export in mobile Chromium and iPhone WebKit
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createServer } from 'node:http';
          import { readFile } from 'node:fs/promises';
          import { once } from 'node:events';
          import { createRequire } from 'node:module';
          import { join } from 'node:path';
          import { DEMO_PURCHASES, DEMO_EXPENSES } from './site/data.js';
          import { makeBackup } from './site/records.js';
          const require = createRequire(import.meta.url);
          const { chromium, webkit, devices } = require(join(process.env.RUNNER_TEMP, 'browser-tools/node_modules/playwright'));
          const prefix = '/finance-agent-web/';
          const files = new Map(['index.html','styles.css','app.js','core.js','data.js','icon.svg','records.js','storage.js','local.js'].map(name => [prefix + name, name]));
          files.set(prefix, 'index.html');
          const mime = { html:'text/html', css:'text/css', js:'text/javascript', svg:'image/svg+xml' };
          const server = createServer(async (request, response) => {
            if (!['GET','HEAD'].includes(request.method)) { response.writeHead(405); response.end(); return; }
            const name = files.get(new URL(request.url, 'http://internal').pathname);
            if (!name) { response.writeHead(404); response.end(); return; }
            response.writeHead(200, { 'Content-Type': mime[name.split('.').pop()] + '; charset=utf-8', 'Cache-Control':'no-store' });
            response.end(request.method === 'HEAD' ? undefined : await readFile(`site/${name}`));
          });
          server.listen(0, '127.0.0.1'); await once(server, 'listening');
          try {
            for (const [engine, device] of [[chromium, devices['Pixel 7']], [webkit, devices['iPhone 13']]]) {
              const browser = await engine.launch();
              try {
                const context = await browser.newContext(device);
                const page = await context.newPage();
                const errors = []; page.on('pageerror', () => errors.push('pageerror'));
                page.on('console', message => { if (message.type() === 'error') errors.push('consoleerror'); });
                await page.goto(`http://127.0.0.1:${server.address().port}${prefix}`);
                await page.waitForFunction(() => document.querySelector('#overview').textContent.includes('1,260,000원'));
                await page.waitForLoadState('networkidle');
                const requests = []; page.on('request', () => requests.push('request'));
                await context.setOffline(true);
                await page.getByRole('button', {name:/합성 데모로/}).click();
                assert.ok((await page.locator('#overview').innerText()).includes('131,900원'));
                await page.getByRole('button', {name:'투자 계획·결산',exact:true}).click();
                await page.locator('#purchases-file').setInputFiles({name:'synthetic.csv',mimeType:'text/csv',buffer:Buffer.from(DEMO_PURCHASES)});
                await page.waitForFunction(() => document.querySelector('#purchases-state').textContent.includes('선택 월 18건'));
                assert.ok((await page.locator('#investment-cards').innerText()).includes('1,180,000원'));
                assert.ok((await page.locator('#investment-cards').innerText()).includes('80,000원'));
                await page.getByRole('button', {name:'지출 분석',exact:true}).click();
                await page.locator('#expenses-file').setInputFiles({name:'synthetic.csv',mimeType:'text/csv',buffer:Buffer.from('\ufeff' + DEMO_EXPENSES)});
                await page.waitForFunction(() => document.querySelector('#expenses-state').textContent.includes('선택 월 9건'));
                assert.ok((await page.locator('#expense-cards').innerText()).includes('131,900원'));
                assert.deepEqual(requests, [], 'File selection and analysis must not transmit data');
                assert.deepEqual(errors, []);
                assert.equal(await page.evaluate(() => localStorage.length + sessionStorage.length), 0);
                await page.getByRole('button', {name:'기록 지우기',exact:true}).click();
                assert.equal(await page.locator('#expenses-state').innerText(), '아직 기록을 선택하지 않았습니다.');
                // Only synthetic records are used; downloads remain temporary and are never uploaded.
                const waitText = (id, text) => page.waitForFunction(({id,text}) => document.getElementById(id).textContent.includes(text), {id,text});
                const local = () => page.getByRole('button',{name:'기기 내 기록',exact:true}).click();
                const count = value => waitText('saved-records',`전체 ${value}건`);
                const chooseBackup = async rows => {
                  await page.locator('#restore-file').setInputFiles({name:'synthetic-backup.json',mimeType:'application/json',buffer:Buffer.from(makeBackup(rows))});
                  await page.waitForFunction(() => !document.getElementById('restore-preview').hidden);
                };
                const restore = async mode => {
                  await page.locator(`[name=restore-mode][value=${mode}]`).check();
                  await page.locator('#apply-restore').click();
                };
                const reload = async () => {
                  await context.setOffline(false); await page.reload(); await page.waitForLoadState('networkidle');
                  await page.getByLabel('분석할 월').fill('2026-01'); await page.getByLabel('분석할 월').dispatchEvent('change');
                  await local(); await page.waitForFunction(() => !document.getElementById('use-saved').disabled && !document.getElementById('local-controls').disabled);
                  requests.length = 0; await context.setOffline(true);
                };
                await local(); await count(0);
                page.on('dialog', dialog => dialog.accept());
                await page.locator('#investment-date').fill('2026-01-13');
                await page.locator('#investment-symbol').fill('379800');
                await page.locator('#investment-amount').fill('270000');
                await page.locator('#investment-form button[type=submit]').click(); await count(1);
                await page.locator('#expense-date').fill('2026-01-14');
                await page.locator('#expense-merchant').fill('합성 카페');
                await page.locator('#expense-amount').fill('4500');
                await page.locator('#expense-form button[type=submit]').click(); await count(2);
                await page.locator('.saved-record').filter({hasText:'합성 카페'}).getByRole('button',{name:/수정$/}).click();
                await page.locator('#expense-amount').fill('9000'); await page.locator('#expense-category').fill('합성 수동');
                await page.locator('#expense-form button[type=submit]').click(); await waitText('saved-records','합성 수동');
                await page.locator('#investment-date').fill('2026-01-14');
                await page.locator('#investment-symbol').fill('CASH-RESERVE');
                await page.locator('[name=kind][value=reserve]').check();
                await page.locator('#investment-amount').fill('80000');
                await page.locator('#investment-form button[type=submit]').click(); await count(3);
                assert.deepEqual(requests, [], 'Direct input must not transmit data');
                const downloaded = page.waitForEvent('download'); await page.locator('#export-backup').click();
                const backup = JSON.parse(await readFile(await (await downloaded).path(),'utf8'));
                assert.equal(backup.schemaVersion,1); assert.equal(backup.records.length,3);
                await chooseBackup(backup.records); await restore('merge'); await waitText('storage-status','복원 완료'); await count(3);
                await page.locator('#restore-file').setInputFiles({name:'synthetic-corrupt.json',mimeType:'application/json',buffer:Buffer.from('{')});
                await waitText('error','손상된'); await count(3);
                await chooseBackup([backup.records.find(r => r.type === 'expense')]);
                await page.evaluate(() => {
                  const original = IDBObjectStore.prototype.put;
                  IDBObjectStore.prototype.put = function(...args) {
                    if (this.name === 'meta') throw new DOMException('synthetic failure','QuotaExceededError');
                    return original.apply(this,args);
                  };
                });
                await restore('replace'); await waitText('error','저장에 실패');
                await reload(); await count(3); // A failed replacement preserved all original records.
                await page.getByRole('button',{name:/합성 데모로/}).click();
                await page.getByRole('button',{name:'기록 지우기',exact:true}).click(); await count(3);
                const replacement = {...backup.records.find(r => r.type === 'expense'),id:'synthetic-replacement',amount:'1'};
                await chooseBackup([replacement]); await restore('replace'); await waitText('storage-status','복원 완료'); await count(1);
                await reload(); await count(1); await waitText('saved-records','1원');
                await page.locator('.saved-record').getByRole('button',{name:/삭제$/}).click(); await count(0);
                assert.deepEqual(requests, [], 'Backup, restore and deletion must not transmit data');
                assert.deepEqual(errors, []);
                await context.close();
              } finally { await browser.close(); }
            }
          } finally { await new Promise(resolve => server.close(resolve)); }
          console.log('Both mobile browser exports passed CSV/demo and 1.3 CRUD, persistence, backup and rollback checks; no artifacts uploaded.');
          JS
